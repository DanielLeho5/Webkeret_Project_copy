<nav class="pagination" role="navigation" aria-label="Pagination">
	<button class="page-button" (click)="previousPage()" [disabled]="currentPage === 1" [attr.aria-disabled]="currentPage === 1">Previous</button>
	<span class="page-label" aria-live="polite">Page {{ currentPage }} of {{ totalPages }}</span>
	<button class="page-button" (click)="nextPage()" [disabled]="currentPage === totalPages" [attr.aria-disabled]="currentPage === totalPages">Next</button>
</nav>
