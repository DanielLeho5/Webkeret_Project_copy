<section class="export-data" role="region" aria-labelledby="export-data-title">
  <h2 id="export-data-title">Export Data</h2>
  <p class="description">Export your health data in CSV or JSON format for the selected date range and categories.</p>

  <form class="export-form" #exportForm="ngForm" role="form" aria-labelledby="export-data-title">
    <div class="form-group">
      <label for="format">Export Format</label>
      <select
        id="format"
        name="format"
        [(ngModel)]="exportFormat"
        required
        class="form-select"
        aria-describedby="format-help"
      >
        <option value="csv">CSV</option>
        <option value="json">JSON</option>
      </select>
    </div>

    <div class="form-group">
      <label>Categories to Export</label>
      <div class="categories-checkboxes">
        <label class="category-checkbox select-all">
          <input
            type="checkbox"
            [checked]="isAllSelected()"
            [indeterminate]="isIndeterminate()"
            (change)="toggleSelectAll()"
            class="checkbox-input"
          >
          <span class="checkbox-label select-all-label">Select All</span>
        </label>
        <label *ngFor="let category of availableCategories" class="category-checkbox">
          <input
            type="checkbox"
            [checked]="isSelected(category._id)"
            (change)="toggleCategory(category._id)"
            name="categories"
            class="checkbox-input"
          >
          <span class="checkbox-label">{{ category.name }}</span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="startDate">Start Date</label>
      <input
        type="date"
        id="startDate"
        name="startDate"
        [(ngModel)]="startDate"
        required
        class="form-input"
      >
    </div>

    <div class="form-group">
      <label for="endDate">End Date</label>
      <input
        type="date"
        id="endDate"
        name="endDate"
        [(ngModel)]="endDate"
        required
        class="form-input"
      >
    </div>

    <button
      type="button"
      class="export-btn"
      (click)="exportData()"
      [disabled]="!exportForm.valid || selectedCategories.length === 0"
    >
      <mat-icon>download</mat-icon>
      Export Data
    </button>
  </form>
</section>
