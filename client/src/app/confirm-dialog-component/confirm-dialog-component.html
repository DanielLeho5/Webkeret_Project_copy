<div class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <div class="dialog-box">
    <p id="dialog-title">Are you sure?</p>
    <div class="dialog-actions">
      <button class="dialog-button" (click)="onConfirm()">Yes</button>
      <button class="dialog-button" (click)="onCancel()">No</button>
    </div>
  </div>
</div>
