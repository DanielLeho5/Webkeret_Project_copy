<mat-card>
  <mat-card-header>
    <h2 mat-card-title>{{ title }}</h2>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" *ngIf="isRegistration">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name">
        <mat-error *ngIf="authForm.get('name')?.invalid && authForm.get('name')?.touched">
          Name is required
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email">
        <mat-error *ngIf="authForm.get('email')?.invalid && authForm.get('email')?.touched">
          Please enter a valid email
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password">
        <mat-error *ngIf="authForm.get('password')?.invalid && authForm.get('password')?.touched">
          Password must be at least 8 characters
        </mat-error>
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit" [disabled]="authForm.invalid || isLoading">
        {{ isLoading ? 'Loading...' : 'Submit' }}
      </button>
    </form>
    <div class="auth-switch">
      <span>{{ isRegistration ? 'Already have an account?' : 'Don\'t have an account?' }}</span>
      <a [routerLink]="isRegistration ? '/login' : '/register'">{{ isRegistration ? 'Login' : 'Register' }}</a>
    </div>
    <ng-content></ng-content>
  </mat-card-content>
</mat-card>
